[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0"
description = "Reads your Claude, Codex, and Copilot chat history and coaches you on how to use AI better."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Praxis"}]
license = {text = "Proprietary"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # The lint/type config below is only meaningful if the tools are
  # installable; pin them here so `uv pip install -e .[dev]` is enough
  # to reproduce the gate that CI and contributors run.
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
praxis = "praxis.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["praxis*"]

[tool.setuptools.package-data]
praxis = ["data/builtin_cards/*.json", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# The Anthropic / OpenAI SDKs return content unions where the per-item
# .text / .content attributes are only present on specific block types.
# The codebase narrows via runtime checks (getattr(b, "type", None) == "text"
# or `if have_anthropic` flags around dual-client paths) that mypy cannot
# statically follow. Disabling union-attr here documents the convention;
# new code that needs to access union attributes should use isinstance()
# narrowing so this disable stays bounded to the existing pattern.
disable_error_code = ["union-attr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Moved under [tool.ruff.lint] (ruff deprecated the top-level form; the
# old placement silently stopped applying in newer ruff, which is how the
# suppressions had drifted out of effect).
# E402: module-level imports after early-execution code (used in
# storage/profile_store.py for sqlite registration before imports).
# E501: line-length is enforced by line-length above; ruff still
# flags strings inside code that intentionally exceed the limit.
# E741: ambiguous single-char names in a few tight numeric helpers.
ignore = ["E402", "E501", "E741"]

[tool.vulture]
# vulture exits 2 with no paths, which reads as a broken hook rather than a
# finding, so this section is what makes the pre-commit hook usable at all.
# min_confidence 80 keeps it to findings worth reading; a reviewed whitelist.py
# goes in paths once one exists.
min_confidence = 80
paths = ['praxis']

[tool.codespell]
# All verified false positives. propert and ned are fragments of regexes in
# praxis/behavior/signals.py - propert(y|ies) and scan(ned)? - not words.
# iTerm is the terminal app.
ignore-words-list = "iterm,nd,ned,pre-empt,propert,re-use,unparseable"
skip = "uv.lock,*/package-lock.json,.git"
