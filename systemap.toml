    { item = "single module: ComponentMap contains only praxis.components", evidence = "c6f60a994bb53a555c651c498c93d583aff4e0716ac4e492295b9837128f68be", reason = "The module makes the component maps that define the nodes of each structural item, and it prints them as owner toml. No other module does this.", citations = [{ file = "src/praxis/components.py", start_line = 1, end_line = 15, sha256 = "80012550fcc15426d705e21e29c244740d7bd36c96c628078eec2692f1536df9" }] },
