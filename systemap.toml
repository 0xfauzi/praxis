    { item = "single module: ItemPool contains only praxis.pool", evidence = "824bba52ec727b85ea372bbb893e7980d1e7feaa0ae74c1b39d9fc238fa39bec", reason = "The module freezes the component map, writes and adds again the D1 items, and drafts the owner map. No other module writes items.", citations = [{ file = "src/praxis/pool.py", start_line = 1, end_line = 19, sha256 = "3698e55ba4812fda5b127b7b54ff7029359baabab5e0075eea95e566f404a9fb" }, { file = "src/praxis/pool.py", start_line = 89, end_line = 96, sha256 = "3698e55ba4812fda5b127b7b54ff7029359baabab5e0075eea95e566f404a9fb" }] },
    { item = "single module: TaskRegistration contains only praxis.task", evidence = "fc82e5d3d7c3bede212918964511db4b50695bf90cb7fe589b67b894808532af", reason = "The module draws the start week, registers tasks, draws the arm and the bound items, takes forecasts, and gives the result. No other module does this.", citations = [{ file = "src/praxis/task.py", start_line = 1, end_line = 18, sha256 = "034e167268d6ebc5f8b89df9f3d3b9129461827c6380cbd09d14a40845d8579d" }, { file = "src/praxis/task.py", start_line = 76, end_line = 98, sha256 = "034e167268d6ebc5f8b89df9f3d3b9129461827c6380cbd09d14a40845d8579d" }] },
    { item = "single module: Probe contains only praxis.probe", evidence = "9a7521c67ba7d3ca47462b75e8573970d09934d3849afda009939949b893b9f4", reason = "The module gives the unassisted probes behind the attached-agent check, draws the validation items, and stores the answers. No other module asks probe items.", citations = [{ file = "src/praxis/probe.py", start_line = 1, end_line = 26, sha256 = "fb5a69c723f1e68438558c70bef0b37065479316b217989a1f27b2b1a13aa5f2" }, { file = "src/praxis/probe.py", start_line = 196, end_line = 210, sha256 = "fb5a69c723f1e68438558c70bef0b37065479316b217989a1f27b2b1a13aa5f2" }] },
    { item = "single module: ScenarioRunner contains only praxis.scenarios", evidence = "0164dbce6a44faa9bab62a55f8a4b21248344e396da1df930becd163174ed8fa", reason = "The module reads the owner scenario file, runs each scenario in a scratch clone, and writes scenario runs. The extractors only trace, and no other module stores runs.", citations = [{ file = "src/praxis/scenarios.py", start_line = 1, end_line = 20, sha256 = "f9a5941174bec32d63de071aa2f7ee0346a5526697e72f88c8211b9d93ed0bab" }, { file = "src/praxis/scenarios.py", start_line = 114, end_line = 118, sha256 = "f9a5941174bec32d63de071aa2f7ee0346a5526697e72f88c8211b9d93ed0bab" }] },
